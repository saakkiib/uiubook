<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MySocial - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- full page container -->
    <div class="page-wrapper">
        
        <!-- LEFT SIDE : logo+para -->
        <div class="left-panel">
            <h1 class="logo-text">UIUbook</h1>
            <h2 class="recent-title">UIUbook helps us connect and share with the people in our campus.</h2>
            <p class="recent-subtitle">login or create new account for join.</p>

            
        </div>

        <!-- RIGHT SIDE : login form -->
        <div class="right-panel">
            <div class="login-box">
                <form action="login.php" method="post">
                    <input 
                        type="text" 
                        name="email" 
                        placeholder="Email address or phone number" 
                        class="input-field"
                        required
                    >

                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Password" 
                        class="input-field"
                        required
                    >

                    <button type="submit" class="btn btn-login">
                        Log in
                    </button>

                    <a href="https://www.facebook.com/login/identify/?ctx=recover&ars=facebook_login&from_login_screen=0" class="forgot-link">Forgotten password?</a>

                    <hr class="divider">

                    <button type="button" class="btn btn-create">
                         <a href="https://www.facebook.com/r.php?entry_point=login" class="btn-create">Create new account</a>
                    </button>
                </form>
            </div>

            <p class="create-page-text">
                <a href="" class="create-page-link">Create a Page</a>
                for a celebrity, brand or business.
            </p>
        </div>
    </div>
</body>
</html>
